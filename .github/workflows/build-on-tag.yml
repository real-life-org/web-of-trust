# Duenne Huelle um scripts/release/build-android.sh — die gesamte Logik lebt
# dort ("Plattform ist Trigger, nicht Gehirn"). Ein Umzug zu Forgejo/GitLab
# ersetzt nur diese Datei.
#
# Das Artefakt ist ein UNSIGNIERTES/debug-signiertes APK und wird bewusst NICHT
# ans GitHub-Release gehaengt: dort liegt ausschliesslich das mit dem
# F-Droid-Schluessel signierte APK, sonst installieren Obtainium-Nutzer eine
# Debug-Signatur und koennen nie wieder regulaer updaten.
#
# Job `ios` (nur app-v3.* und spaeter): apps/wot-v3/scripts/build-ios.sh auf einem
# macOS-Runner, signiert mit den Secrets des Repos (deploy/ios/README.md) und laedt
# zu TestFlight hoch; ohne Secrets unsigniertes Archiv als Artefakt. Apple-Signatur
# in CI, nicht im Signierdienst: der laeuft auf Linux, Xcode gibt es nur auf macOS.
name: Build on Tag

on:
  push:
    tags: ['app-v[0-9]*']      # nur App-Tags; core-v*, adapter-*, ota-* und Alt-Tags v* nicht
  workflow_dispatch:
    inputs:
      tag:
        description: 'App-Tag, der gebaut werden soll (z.B. app-v0.2.7)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # KEIN version:-Input — packageManager in der package.json entscheidet.
      # v4 bricht sonst mit "Multiple versions of pnpm specified" ab (#314).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # inputs.tag NIE direkt in run: interpolieren — das waere Script-Injection
      # (ein Dispatch-Input wie '"; boesartig; echo "' liefe als Shell-Code).
      # Ueber env ist der Wert ein inertes Datum, das Skript quotet ihn.
      #
      # Zwei Apps, ein Workflow (der Signierdienst wot-release bindet an genau
      # diesen Workflow-Pfad und das Artefakt android-<tag>):
      #   app-v0.* / app-v1.* / app-v2.*  → apps/demo (Gen 2), wie bisher
      #   app-v3.* und spaeter            → apps/wot-v3 (nur Play-AAB, kein OTA)
      # Gen 2 und v3 teilen den Tag-Namensraum app-v*, die Weiche ist die
      # Hauptversion: Gen 2 (apps/demo, release-please) muss deshalb unter 3.0.0
      # bleiben; ein Gen-2-Tag >= 3.0.0 liefe in den v3-Build und baute die
      # v3-App unter dieser Version.
      - name: Build
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # nur der v3-Build liest ihn; fehlt er, bricht apps/wot-v3/scripts/build-android.sh ab
          VITE_MEDIATOR_DID: ${{ vars.VITE_MEDIATOR_DID }}
        run: |
          if [[ "$TAG" =~ ^app-v([0-9]+)\. ]] && [ "$((10#${BASH_REMATCH[1]}))" -ge 3 ]; then
            apps/wot-v3/scripts/build-android.sh "$TAG"
          else
            scripts/release/build-android.sh "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: out/release/
          retention-days: 30
          if-no-files-found: error

  # iOS, v3 and later only (apps/wot-v3 has the shell, apps/demo's ios/ was never released). The
  # Gen-2 majors are excluded here; the script aborts for them as well.
  ios:
    if: >-
      ${{ !startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'app-v0.')
       && !startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'app-v1.')
       && !startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'app-v2.') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # secrets are not readable in `if:`; this flag is
      HAS_ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Signing material only from secrets; all four or none (the script refuses a partial set). Without
      # them the run ends with the unsigned archive as the artifact, so the pipeline is testable before
      # Tillmann's one-time steps (deploy/ios/README.md).
      - name: Build (archive, export, native artifact check)
        env:
          VITE_MEDIATOR_DID: ${{ vars.VITE_MEDIATOR_DID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: apps/wot-v3/scripts/build-ios.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: out/release-ios/
          retention-days: 30
          if-no-files-found: error

      - name: Build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: out/ios-work/*.log
          if-no-files-found: ignore

      # TestFlight: upload with the App Store Connect API key, then into the external group named by
      # IOS_TESTFLIGHT_GROUP (first build of a version: Beta App Review). Skipped without the key; the
      # script refuses an unsigned build.
      - name: TestFlight
        if: env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_TESTFLIGHT_GROUP: ${{ vars.IOS_TESTFLIGHT_GROUP }}
        run: apps/wot-v3/scripts/upload-testflight.sh "$TAG"
