# Duenne Huelle um scripts/release/build-android.sh — die gesamte Logik lebt
# dort ("Plattform ist Trigger, nicht Gehirn"). Ein Umzug zu Forgejo/GitLab
# ersetzt nur diese Datei.
#
# Das Artefakt ist ein UNSIGNIERTES/debug-signiertes APK und wird bewusst NICHT
# ans GitHub-Release gehaengt: dort liegt ausschliesslich das mit dem
# F-Droid-Schluessel signierte APK, sonst installieren Obtainium-Nutzer eine
# Debug-Signatur und koennen nie wieder regulaer updaten.
name: Build on Tag

on:
  push:
    tags: ['app-v[0-9]*']      # nur App-Tags; core-v*, adapter-*, ota-* und Alt-Tags v* nicht
  workflow_dispatch:
    inputs:
      tag:
        description: 'App-Tag, der gebaut werden soll (z.B. app-v0.2.7)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # KEIN version:-Input — packageManager in der package.json entscheidet.
      # v4 bricht sonst mit "Multiple versions of pnpm specified" ab (#314).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # inputs.tag NIE direkt in run: interpolieren — das waere Script-Injection
      # (ein Dispatch-Input wie '"; boesartig; echo "' liefe als Shell-Code).
      # Ueber env ist der Wert ein inertes Datum, das Skript quotet ihn.
      #
      # Zwei Apps, ein Workflow (der Signierdienst wot-release bindet an genau
      # diesen Workflow-Pfad und das Artefakt android-<tag>):
      #   app-v0.* / app-v1.* / app-v2.*  → apps/demo (Gen 2), wie bisher
      #   app-v3.* und spaeter            → apps/wot-v3 (nur Play-AAB, kein OTA)
      # Gen 2 und v3 teilen den Tag-Namensraum app-v*, die Weiche ist die
      # Hauptversion: Gen 2 (apps/demo, release-please) muss deshalb unter 3.0.0
      # bleiben; ein Gen-2-Tag >= 3.0.0 liefe in den v3-Build und baute die
      # v3-App unter dieser Version.
      - name: Build
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # nur der v3-Build liest ihn; fehlt er, bricht apps/wot-v3/scripts/build-android.sh ab
          VITE_MEDIATOR_DID: ${{ vars.VITE_MEDIATOR_DID }}
        run: |
          if [[ "$TAG" =~ ^app-v([0-9]+)\. ]] && [ "$((10#${BASH_REMATCH[1]}))" -ge 3 ]; then
            apps/wot-v3/scripts/build-android.sh "$TAG"
          else
            scripts/release/build-android.sh "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: out/release/
          retention-days: 30
          if-no-files-found: error
