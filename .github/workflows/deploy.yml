name: Deploy Landing + Demo + v3 web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'apps/landing/**'
      - 'apps/benchmark/**'
      - 'apps/wot-v3/**'
      - 'packages/wot-core/**'
      - 'packages/adapter-yjs/**'
      - 'packages/adapter-automerge/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'OTA rollback: release tag to restore (e.g. ota-a3f9c12). Leave empty for normal deploy.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # vNext-Backend auf web-of-trust.de (gilt fuer alle Demo-Builds: OTA-Bundles
    # + Pages). Ohne das nutzt die App die appRuntime-Defaults
    # (relay.utopia-lab.org + localhost:8788) → in Prod kaputt. Der alte
    # utopia-lab.org-Stack laeuft fuer Legacy-Clients parallel weiter.
    env:
      VITE_RELAY_URL: wss://relay.web-of-trust.de
      VITE_PROFILE_SERVICE_URL: https://profiles.web-of-trust.de
      VITE_VAULT_URL: https://vault.web-of-trust.de
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the Gen-2 OTA decision diffs against the previous main commit
          fetch-depth: 0

      # New Gen-2 OTA bundles only when their inputs changed (or on a dispatch); a landing or v3 merge
      # keeps the live ones, so the Gen-2 apps get no update without content.
      - name: Gen-2 OTA needed?
        id: ota
        run: scripts/release/gen2-ota-needed.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter @web_of_trust/core build
          pnpm --filter @web_of_trust/adapter-yjs build
          pnpm --filter @web_of_trust/adapter-automerge build

      - name: Run tests
        run: pnpm test

      - name: Build landing
        run: pnpm --filter landing build

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # OTA bundles: VITE_BASE_PATH=/ (native app loads from capacitor://localhost/)
      - name: Build OTA bundle (ios)
        if: steps.ota.outputs.needed == 'true'
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /
          VITE_UPDATE_SERVER_URL: https://web-of-trust.de
          VITE_UPDATE_CHANNEL: ios

      - name: Zip iOS bundle
        if: steps.ota.outputs.needed == 'true'
        run: (cd apps/demo/dist && zip -r "../../../bundle-ios-${SHORT_SHA}.zip" .)

      - name: Build OTA bundle (android)
        if: steps.ota.outputs.needed == 'true'
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /
          VITE_UPDATE_SERVER_URL: https://web-of-trust.de
          VITE_UPDATE_CHANNEL: android

      - name: Zip Android bundle
        if: steps.ota.outputs.needed == 'true'
        run: cd apps/demo/dist && zip -r "../../../bundle-android-${SHORT_SHA}.zip" .

      - name: Build OTA bundle (android-foss)
        if: steps.ota.outputs.needed == 'true'
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /
          VITE_UPDATE_SERVER_URL: https://web-of-trust.de
          VITE_UPDATE_CHANNEL: android-foss
          # TODO: add FOSS-specific env vars here once push notifications are implemented

      - name: Zip Android FOSS bundle
        if: steps.ota.outputs.needed == 'true'
        run: cd apps/demo/dist && zip -r "../../../bundle-android-foss-${SHORT_SHA}.zip" .

      # Festival-/community-box channel: PRIMARY = the local box world
      # (*.box.web-of-trust.de, resolved by the box's dnsmasq inside its WLAN),
      # SECONDARY = the public server world (dual-broker Stage A) — so box-APKs
      # keep their box config across OTA updates AND work anywhere via the
      # secondary. OTA is ENABLED for this channel (VITE_UPDATE_CHANNEL) — the
      # camp population stays updatable after the event.
      - name: Build OTA bundle (android-box)
        if: steps.ota.outputs.needed == 'true'
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /
          VITE_UPDATE_SERVER_URL: https://web-of-trust.de
          VITE_UPDATE_CHANNEL: android-box
          VITE_RELAY_URL: wss://relay.box.web-of-trust.de
          VITE_PROFILE_SERVICE_URL: https://profiles.box.web-of-trust.de
          VITE_VAULT_URL: https://vault.box.web-of-trust.de
          VITE_RELAY_URL_2: wss://relay.web-of-trust.de
          VITE_VAULT_URL_2: https://vault.web-of-trust.de

      - name: Zip Android Box bundle
        if: steps.ota.outputs.needed == 'true'
        run: cd apps/demo/dist && zip -r "../../../bundle-android-box-${SHORT_SHA}.zip" .

      # Web deployment build: VITE_BASE_PATH=/demo/ (served at web-of-trust.de/demo/)
      - name: Build demo for Pages
        run: pnpm --filter demo build
        env:
          VITE_BASE_PATH: /demo/
          VITE_UPDATE_SERVER_URL: https://web-of-trust.de

      - name: Build benchmark with base path
        run: pnpm --filter benchmark build
        env:
          VITE_BASE_PATH: /benchmark/

      - name: Create GitHub Release with OTA bundles
        if: steps.ota.outputs.needed == 'true' && inputs.rollback_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ota-${SHORT_SHA}" \
            --title "OTA ${SHORT_SHA}" \
            --notes "Automatic OTA release from commit ${SHORT_SHA}" \
            bundle-ios-${SHORT_SHA}.zip \
            bundle-android-${SHORT_SHA}.zip \
            bundle-android-foss-${SHORT_SHA}.zip \
            bundle-android-box-${SHORT_SHA}.zip

      - name: Generate latest.json (normal deploy)
        if: steps.ota.outputs.needed == 'true' && inputs.rollback_tag == ''
        run: |
          REPO="${{ github.repository }}"
          for channel in ios android android-foss android-box; do
            mkdir -p combined/updates/${channel}
            printf '{"bundleId":"%s","url":"%s"}\n' \
              "${SHORT_SHA}" \
              "https://github.com/${REPO}/releases/download/ota-${SHORT_SHA}/bundle-${channel}-${SHORT_SHA}.zip" \
              > combined/updates/${channel}/latest.json
          done

      - name: Generate latest.json (rollback)
        if: inputs.rollback_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ inputs.rollback_tag }}"
          BUNDLE_ID="${TAG#ota-}"
          for channel in ios android android-foss android-box; do
            mkdir -p combined/updates/${channel}
            printf '{"bundleId":"%s","url":"%s"}\n' \
              "${BUNDLE_ID}" \
              "https://github.com/${REPO}/releases/download/${TAG}/bundle-${channel}-${BUNDLE_ID}.zip" \
              > combined/updates/${channel}/latest.json
          done
          echo "Rolling back OTA to ${TAG}"

      # no new OTA: the site is rebuilt as a whole, so the live pointers are carried over unchanged;
      # curl -f stops the deploy if one is missing, rather than publishing a site without it
      - name: Keep the live OTA pointers
        if: steps.ota.outputs.needed == 'false'
        run: |
          for channel in ios android android-foss android-box; do
            mkdir -p combined/updates/${channel}
            curl -fsS "https://web-of-trust.de/updates/${channel}/latest.json" -o combined/updates/${channel}/latest.json
          done

      # The v3 web app (apps/wot-v3, target web) at web-of-trust.de/app/, with the mediator of the
      # store builds; the store-build check runs inside build:web
      - name: Build v3 web app for Pages
        run: pnpm --filter wot-v3 build:web
        env:
          VITE_BASE_PATH: /app/
          VITE_MEDIATOR_DID: ${{ vars.VITE_MEDIATOR_DID }}

      - name: Combine builds
        run: |
          cp -r apps/landing/dist/. combined/
          mkdir -p combined/demo
          cp -r apps/demo/dist/* combined/demo/
          mkdir -p combined/benchmark
          cp -r apps/benchmark/dist/* combined/benchmark/
          mkdir -p combined/app
          cp -r apps/wot-v3/dist/. combined/app/

      - name: SPA fallback (GitHub Pages serves 404.html on unknown routes)
        run: |
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><script>var p=location.pathname+location.search+location.hash;var t=p.startsWith("/demo")?"/demo/":p.startsWith("/app")?"/app/":"/";sessionStorage.setItem("spa-redirect",p);location.replace(t);</script></head><body></body></html>' \
            > combined/404.html
          cp combined/404.html combined/demo/404.html
          cp combined/404.html combined/app/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
