name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # Regressionstest fuer die Package→App-Releasekaskade. Eigener Job, weil er
  # weder Install noch Build braucht — er liest nur die release-please-Config und
  # die Manifeste. Faengt genau die zwei Fehler, die in PR #330 passiert und in
  # der CI unsichtbar waren: App als "simple" (faellt aus dem
  # node-workspace-Graphen) und ein root-relativer extra-files-Pfad (bumpt die
  # Versionsdatei nie). Ohne diesen Vertrag erreicht ein core-/adapter-Fix Play
  # nie, weil Play bewusst kein OTA hat.
  release-cascade:
    runs-on: ubuntu-latest
    # Minimalrecht: der Job liest nur Dateien aus dem Checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaskaden-Vertrag pruefen
        run: node scripts/release/test-release-cascade.mjs

      # Der Waechter muss auch beweisen, dass er BEISST: der Selbsttest laesst ihn
      # gegen praeparierte Fixtures laufen und verlangt, dass jede Verletzung rot
      # wird. Ohne das koennte er wieder still fail-open werden.
      - name: Waechter-Selbsttest (Negativfaelle)
        run: node scripts/release/test-release-cascade.selftest.mjs

      - name: Publish-Dispatcher — alle Release-Zuschnitte
        run: node scripts/release/test-dispatch-publish.mjs

      - name: Gen-2-OTA-Entscheidung + Pages-Vertrag (v3 unter /app/)
        run: node scripts/release/test-gen2-ota-needed.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm --filter @web_of_trust/core --filter @web_of_trust/adapter-yjs --filter @web_of_trust/adapter-automerge build

      - name: Typecheck
        run: pnpm typecheck

      # Ausgabe mitschreiben und als Artefakt sichern. Ein Rerun ueberschreibt die
      # Run-Logs auf GitHub — ohne Artefakt ist die Evidenz eines Flakes danach weg
      # und er bleibt undiagnostizierbar. set -o pipefail, damit tee den Exit-Code
      # von vitest nicht verschluckt.
      - name: Test
        run: set -o pipefail && pnpm test 2>&1 | tee /tmp/test-output.log

      # run_attempt im Namen: sonst ueberschreibt der Rerun das Artefakt des
      # fehlgeschlagenen Versuchs und wir stehen wieder ohne Spur da. Auch bei
      # Erfolg hochladen — gerade der Vergleich rot/gruen auf demselben Commit
      # ist bei einem Flake die aussagekraeftigste Information.
      - name: Testausgabe sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-attempt-${{ github.run_attempt }}
          path: /tmp/test-output.log
          retention-days: 14
