name: wot-v3

# Checks for the v3 app in apps/wot-v3. Builds nothing that is deployed: the store-build check runs on
# a web build that stays in the runner, and the Android job builds a debug APK (debug key, application
# id org.reallife.weboftrust.debug) as a workflow artifact for testing. No deploy, no OTA, no release
# (release builds come from build-on-tag.yml on app-v3.* tags).
on:
  pull_request:
    paths:
      - 'apps/wot-v3/**'
      - '.github/workflows/wot-v3.yml'
  push:
    branches: [main]
    paths:
      - 'apps/wot-v3/**'
      - '.github/workflows/wot-v3.yml'

permissions:
  contents: read

concurrency:
  group: wot-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wot-v3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (wot-v3 only)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter wot-v3

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundaries (architecture §1.1)
        run: pnpm check:boundaries

      - name: Boundaries, negative fixtures must fail
        run: pnpm check:boundaries:negative

      - name: Unit tests
        run: pnpm test

      - name: Unit tests that need the garbage collector (gc-only)
        run: pnpm test:gc

      - name: Store-build check on the web target (§8.2)
        run: pnpm build:web

  # The native rules without a web bundle and without the mediator: JUnit of the own plugins
  # (BiometricPolicy, EntryReplacement) and Android lint. `cap update` writes the plugin projects
  # Gradle needs (no web assets).
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (wot-v3 only)
        run: pnpm install --frozen-lockfile --filter wot-v3

      - name: Capacitor plugin projects (play)
        working-directory: apps/wot-v3
        env:
          VITE_TARGET: play
        run: pnpm exec cap update android

      - name: JUnit and lint of the native shell
        working-directory: apps/wot-v3/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

  # Without the repository variable VITE_MEDIATOR_DID nothing native can be built (the store-build
  # check refuses a native build without a mediator): the job `android` is then skipped (shown as
  # skipped, never as built) and `android-not-built` says why.
  android-not-built:
    if: vars.VITE_MEDIATOR_DID == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice title=Android debug APK not built::The repository variable VITE_MEDIATOR_DID is empty; the job android is skipped."

  android:
    if: vars.VITE_MEDIATOR_DID != ''
    runs-on: ubuntu-latest
    env:
      VITE_MEDIATOR_DID: ${{ vars.VITE_MEDIATOR_DID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (wot-v3 only)
        run: pnpm install --frozen-lockfile --filter wot-v3

      - name: Debug APK (play bundle, store-build check, JUnit, native artifact check)
        run: apps/wot-v3/scripts/build-debug-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wot-v3-debug-apk
          path: apps/wot-v3/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
